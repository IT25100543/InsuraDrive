<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Payment - InsuraDrive</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <div style="max-width: 720px; margin: 0 auto;">
            <div class="glass-panel" style="padding: 2.2rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                    <div>
                        <h2 style="color: var(--text-primary); margin-bottom: 0.35rem;">Edit Payment Transaction</h2>
                        <p style="color: var(--text-secondary); font-size: 0.88rem;">
                            Update payment transaction details and installment schedules
                        </p>
                    </div>
                    <span class="badge badge-active" th:text="${payment.transactionId}">TXN-0000</span>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error message</div>

                <form th:action="@{/payments/update/{id}(id=${payment.id})}" th:object="${paymentFormDto}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{policyId}">

                    <div class="form-group">
                        <label class="form-label">Associated Policy Number</label>
                        <input type="text" th:value="${payment.policy != null ? payment.policy.policyNumber : 'N/A'}" class="form-control" disabled style="opacity: 0.7;">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label">Payment Amount (LKR) *</label>
                            <input type="number" step="0.01" th:field="*{amount}" class="form-control" th:errorclass="is-invalid" required>
                            <span class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">Amount required</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Installment Sequence</label>
                            <select th:field="*{installmentNo}" class="form-control">
                                <option value="1">Installment 1 / Full</option>
                                <option value="2">Installment 2</option>
                                <option value="3">Installment 3</option>
                                <option value="4">Installment 4</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Payment Method *</label>
                        <select th:field="*{paymentMethod}" class="form-control" th:errorclass="is-invalid" required>
                            <option value="Online Credit Card">Online Credit Card (Visa / Mastercard)</option>
                            <option value="Bank Direct Transfer">Bank Direct Transfer</option>
                            <option value="Branch Counter Cash Deposit">Branch Counter Cash Deposit</option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}">Method required</span>
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                        <a th:href="@{/payments}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
