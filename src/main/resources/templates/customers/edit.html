<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Customer Profile - InsuraDrive</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <div style="max-width: 720px; margin: 0 auto;">
            <div class="glass-panel" style="padding: 2.2rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                    <div>
                        <h2 style="color: var(--text-primary); margin-bottom: 0.35rem;">Edit Customer Profile</h2>
                        <p style="color: var(--text-secondary); font-size: 0.88rem;">
                            Update customer contact and profile details
                        </p>
                    </div>
                    <span class="badge badge-active" th:text="${customer.nic}">NIC</span>
                </div>

                <form th:action="@{/customers/update}" th:object="${customer}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{nic}">

                    <div class="form-group">
                        <label class="form-label">Full Legal Name *</label>
                        <input type="text" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid" required>
                        <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Full name error</span>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label">National Identity Card (NIC)</label>
                            <input type="text" th:value="*{nic}" class="form-control" disabled style="opacity: 0.7;">
                            <small style="color: var(--text-muted); font-size: 0.75rem;">NIC is a permanent identification identifier.</small>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Driving License Number</label>
                            <input type="text" th:field="*{drivingLicenseNo}" class="form-control" th:errorclass="is-invalid">
                            <span class="field-error" th:if="${#fields.hasErrors('drivingLicenseNo')}" th:errors="*{drivingLicenseNo}">License error</span>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label">Email Address (Mandatory Validation) *</label>
                            <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" required>
                            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Valid email required</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone Number *</label>
                            <input type="tel" th:field="*{phone}" class="form-control" th:errorclass="is-invalid" required>
                            <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone format error</span>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label">Street Address *</label>
                            <input type="text" th:field="*{street}" class="form-control" th:errorclass="is-invalid" required>
                            <span class="field-error" th:if="${#fields.hasErrors('street')}" th:errors="*{street}">Street required</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">City *</label>
                            <input type="text" th:field="*{city}" class="form-control" th:errorclass="is-invalid" required>
                            <span class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">City required</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Postal Code *</label>
                            <input type="text" th:field="*{postalCode}" class="form-control" th:errorclass="is-invalid" required>
                            <span class="field-error" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}">Postal code required</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Verification Status</label>
                        <select th:field="*{verificationStatus}" class="form-control">
                            <option value="VERIFIED">VERIFIED</option>
                            <option value="PENDING_VERIFICATION">PENDING_VERIFICATION</option>
                            <option value="DOCUMENTS_REQUIRED">DOCUMENTS_REQUIRED</option>
                            <option value="REJECTED">REJECTED</option>
                        </select>
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                        <a th:href="@{/customers}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
