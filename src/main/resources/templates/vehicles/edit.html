<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Vehicle - InsuraDrive</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <div style="max-width: 720px; margin: 0 auto;">
            <div class="glass-panel" style="padding: 2.2rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                    <div>
                        <h2 style="color: var(--text-primary); margin-bottom: 0.35rem;">Edit Vehicle Specifications</h2>
                        <p style="color: var(--text-secondary); font-size: 0.88rem;">
                            Update vehicle specifications and registration details
                        </p>
                    </div>
                    <span class="badge badge-active" th:text="${vehicle.registrationNo}">REG-000</span>
                </div>

                <form th:action="@{/vehicles/update}" th:object="${vehicle}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{registrationNo}">

                    <div class="form-group">
                        <label class="form-label">Registered Owner (Customer) *</label>
                        <select th:field="*{customerId}" class="form-control" th:errorclass="is-invalid" required>
                            <option th:each="c : ${customers}"
                                    th:value="${c.id}"
                                    th:text="${c.fullName + ' (NIC: ' + c.nic + ')'}"
                                    th:selected="${vehicle.customerId == c.id}">
                            </option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}">Owner selection error</span>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label">Registration Number</label>
                            <input type="text" th:value="*{registrationNo}" class="form-control" disabled style="opacity: 0.7;">
                            <small style="color: var(--text-muted); font-size: 0.75rem;">Official DMV registration identifier.</small>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Make &amp; Model *</label>
                            <input type="text" th:field="*{model}" class="form-control" th:errorclass="is-invalid" required>
                            <span class="field-error" th:if="${#fields.hasErrors('model')}" th:errors="*{model}">Model error</span>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label">Manufacture Year *</label>
                            <input type="number" th:field="*{manufacturerYear}" class="form-control" th:errorclass="is-invalid" min="1970" max="2027" required>
                            <span class="field-error" th:if="${#fields.hasErrors('manufacturerYear')}" th:errors="*{manufacturerYear}">Year error</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Engine Capacity (CC) *</label>
                            <input type="number" th:field="*{engineCapacity}" class="form-control" th:errorclass="is-invalid" min="50" max="10000" required>
                            <span class="field-error" th:if="${#fields.hasErrors('engineCapacity')}" th:errors="*{engineCapacity}">Engine error</span>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label">Chassis / VIN Number *</label>
                            <input type="text" th:field="*{chassisNo}" class="form-control" th:errorclass="is-invalid" required>
                            <span class="field-error" th:if="${#fields.hasErrors('chassisNo')}" th:errors="*{chassisNo}">Chassis error</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Vehicle Category</label>
                            <select th:field="*{vehicleCategory}" class="form-control">
                                <option value="Sedan / Hybrid">Sedan / Hybrid</option>
                                <option value="SUV / Crossover">SUV / Crossover</option>
                                <option value="Hatchback / Compact">Hatchback / Compact</option>
                                <option value="Motorcycle / Scooter">Motorcycle / Scooter</option>
                                <option value="Commercial Truck / Van">Commercial Truck / Van</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label">Estimated Market Value (LKR) *</label>
                            <input type="number" step="10000" th:field="*{estimatedValue}" class="form-control" th:errorclass="is-invalid" required>
                            <span class="field-error" th:if="${#fields.hasErrors('estimatedValue')}" th:errors="*{estimatedValue}">Value error</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Vehicle Status</label>
                            <select th:field="*{vehicleStatus}" class="form-control">
                                <option value="Active">Active</option>
                                <option value="Pending Inspection">Pending Inspection</option>
                                <option value="Suspended">Suspended</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                        <a th:href="@{/vehicles}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
