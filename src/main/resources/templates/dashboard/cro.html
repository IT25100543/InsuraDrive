<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRO Portal - InsuraDrive</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h2>Customer Relations Officer (CRO) Desk</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Register new customers, enroll vehicles, and
                    issue policy quotes.</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <a th:href="@{/customers/new}" class="btn btn-primary">Register Customer</a>
                <a th:href="@{/vehicles/new}" class="btn btn-secondary">Enroll Vehicle</a>
            </div>
        </div>

        <!-- Customer List -->
        <div class="glass-panel" style="padding: 1.5rem;">
            <h3 style="margin-bottom: 1rem;">Customer Directory</h3>
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                    <tr>
                        <th>NIC / Passport</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>License No</th>
                        <th>Status</th>
                        <th>Registered</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${recentCustomers}">
                        <td th:text="${c.nicPassport}" style="font-weight: 600; color: var(--primary);">
                            12345678V</td>
                        <td th:text="${c.fullName}">Name</td>
                        <td th:text="${c.email}">email@domain.com</td>
                        <td th:text="${c.phone}">+94 77 000 0000</td>
                        <td th:text="${c.drivingLicenseNo != null ? c.drivingLicenseNo : 'N/A'}">B123456</td>
                        <td>
                            <span class="badge" th:classappend="${c.verificationStatus != null ? 'badge-' + #strings.toLowerCase(c.verificationStatus) : 'badge-active'}" th:text="${c.verificationStatus}">VERIFIED</span>
                        </td>
                        <td th:text="${c.registeredAt != null ? #temporals.format(c.registeredAt, 'yyyy-MM-dd HH:mm') : '-'}">Date</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>

</html>
