<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Report Metadata - InsuraDrive</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <div style="max-width: 720px; margin: 0 auto;">
            <div class="glass-panel" style="padding: 2.2rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                    <div>
                        <h2 style="color: var(--text-primary); margin-bottom: 0.35rem;">Edit Report Specifications</h2>
                        <p style="color: var(--text-secondary); font-size: 0.88rem;">
                            Update report parameters and compliance annotations
                        </p>
                    </div>
                    <span class="badge badge-active" th:text="${report.referenceCode}">RPT-2026-0001</span>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error message</div>

                <form th:action="@{/reports/update/{id}(id=${report.id})}" th:object="${reportFormDto}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label class="form-label">Operating Branch Scope</label>
                        <input type="text" th:value="*{branch}" class="form-control" disabled style="opacity: 0.7;">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Compliance Report Type</label>
                        <input type="text" th:value="*{reportType}" class="form-control" disabled style="opacity: 0.7;">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label">Period Start Date *</label>
                            <input type="date" th:field="*{startDate}" class="form-control" th:errorclass="is-invalid" required>
                            <span class="field-error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}">Start date error</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Period End Date *</label>
                            <input type="date" th:field="*{endDate}" class="form-control" th:errorclass="is-invalid" required>
                            <span class="field-error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}">End date error</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Export Output Format *</label>
                        <select th:field="*{format}" class="form-control" th:errorclass="is-invalid" required>
                            <option value="PDF">Portable Document Format (PDF)</option>
                            <option value="EXCEL">Microsoft Excel Spreadsheet (.xlsx)</option>
                            <option value="CSV">Comma Separated Values (.csv)</option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('format')}" th:errors="*{format}">Format required</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Auditor Notes / Compliance Annotations</label>
                        <textarea th:field="*{notes}" class="form-control" rows="3" placeholder="Enter optional notes for management review..."></textarea>
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                        <a th:href="@{/reports}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
